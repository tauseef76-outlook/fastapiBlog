<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - FastAPI Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <style>
        .post-detail-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 3rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.8s ease;
        }

        .post-detail-container h2 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .post-meta {
            color: #999;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
        }

        .post-content {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            word-wrap: break-word;
        }

        .post-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #eee;
        }

        .back-button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .back-button:hover {
            background: #764ba2;
            transform: translateX(-3px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .share-button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #f0f0f0;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid #667eea;
            cursor: pointer;
            font-size: 1rem;
        }

        .share-button:hover {
            background: #667eea;
            color: white;
            transform: translateX(3px);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .post-detail-container {
                padding: 1.5rem;
                margin: 1rem;
            }

            .post-detail-container h2 {
                font-size: 2rem;
            }

            .post-actions {
                flex-direction: column;
            }

            .back-button,
            .share-button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>FastAPI Blog</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/">All Posts</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="post-detail-container">
            <h2>{{ post.title }}</h2>
            <div class="post-meta">
                <span>Post ID: {{ post.id }}</span>
            </div>
            <div class="post-content">
                {{ post.content }}
            </div>
            <div class="post-actions">
                <a href="/" class="back-button">? Back to Home</a>
                <button class="share-button" onclick="sharePost()">?? Share Post</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 FastAPI Blog. All rights reserved. | <a href="/" class="footer-link">Home</a></p>
    </footer>

    <script>
        function sharePost() {
            const title = "{{ post.title }}";
            const url = window.location.href;
            
            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: "Check out this blog post!",
                    url: url
                }).catch(err => console.log('Error sharing:', err));
            } else {
                // Fallback: Copy URL to clipboard
                navigator.clipboard.writeText(url).then(() => {
                    alert('Post URL copied to clipboard!');
                }).catch(err => {
                    alert('Failed to copy URL: ' + err);
                });
            }
        }
    </script>
</body>
</html>
